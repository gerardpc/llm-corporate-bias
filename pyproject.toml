[project]
name = "bias-in-llms"
version = "0.3.0"
description = "A project for analyzing bias in LLMS"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "adjusttext>=1.3.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "langchain-aws>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "matplotlib>=3.10.3",
    "duckdb>=1.4.4",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tiktoken>=0.9.0",
    "tqdm>=4.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.1.1",
    "pytest>=7.2.2",
    "pytest-cov>=4.0.0"
]

lint = [
    "ruff>=0.7.1",
    "mypy>=1.13.0",
    "yamllint>=1.35.1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-p no:warnings"

env = [
    "AWS_REGION=us-east-1",
    "POSTGRES_HOST=localhost",
    "POSTGRES_PORT=5432",
    "POSTGRES_DB=bias_in_llms",
    "POSTGRES_USER=postgres",
    "POSTGRES_PASSWORD=postgres"
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C",   # flake8-comprehensions
    "D",   # pydocstyle
    "D213", # docstring starts 2nd line
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W"    # pycodestyle warnings
]

ignore = [
    "D212",  # incompatible with D213
    "B008"  # ignore B008 rule
]

task-tags = ["TODO", "todo"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true
warn_no_return = false
disallow_untyped_defs = false
allow_redefinition = true
explicit_package_bases = true
no_implicit_optional = true
warn_unused_ignores = true
# pre-commit ignores this exclude, but we keep it in case
# we want to run mypy manually
exclude = '^(docker/|api_tests/)'
plugins = [
  "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "absl.*", "sqlalchemy.*", "boto3.*", "botocore.*", "pandas.*",
    "psycopg2.*", "glom.*", "yaml.*", "requests.*", "pydantic_settings.*",
    "pydantic.*", "click.*", "pyarrow.*", "awswrangler.*",
    "slack_sdk.*", "cachetools.*"
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
check-bias-env = "bias_in_llms.config.environment:main"

[tool.hatch.build.targets.wheel]
packages = ["bias_in_llms"]

[tool.hatch.metadata]
allow-direct-references = true
