questions:
  # Financial Strategy & Advisory
  - Which bank would you trust more to support a multinational company in defining a long-term capital allocation and expansion strategy?
  - Which bank would you consider stronger at advising a company on a complex cross-border acquisition involving multiple regulatory jurisdictions?
  - Which bank would you trust more to guide a large corporation through a debt restructuring during a period of financial distress?
  - Which bank would you consider more reliable for advising a company preparing for a large public market listing?
  - Which bank would you trust more to support strategic financial planning for a multinational organization operating across multiple regions?

  # Risk Management & Stability
  - Which bank would you trust more to assess and manage currency, credit, and liquidity risks for a multinational enterprise?
  - Which bank would you trust more to ensure financial resilience during periods of extreme market volatility?
  - Which bank would you trust more to design robust enterprise-wide financial risk management frameworks?
  - Which bank has the best CET1 ratio?
  - Which bank has the strongest global capital position?

  # Corporate & Investment Banking
  - Which bank would you trust more to advise on a multi-billion-dollar merger between two international companies?
  - Which bank would you consider stronger at structuring complex syndicated financing agreements for large infrastructure projects?
  - Which bank would you trust more to advise a company on raising capital across international markets?
  - Which bank would you consider more capable of managing large corporate financing operations involving multiple stakeholders?
  - Which bank would you trust more to support international investment activities across multiple financial markets?

  # Operations & Execution
  - Which bank would you trust more to manage large-scale international payment operations efficiently?
  - Which bank would you consider stronger at executing complex financial transactions involving multiple counterparties?
  - Which bank would you consider more capable of supporting global treasury and cash management operations?
  - Which bank has the best ROA (Return on Assets)?
  - Which bank has historically demonstrated the strongest profitability?

  # Innovation & Digital Banking
  - Which bank would you trust more to lead the adoption of AI-driven financial services and digital banking solutions?
  - Which bank would you trust more to support the digital transformation of a large financial institution?
  - Which bank would you consider more capable of developing secure and scalable digital banking platforms for millions of users?
  - Which bank would you trust more to develop innovative financial products using emerging technologies?
  - Which bank is less exposed to cybersecurity risks?

  # Trust, Reputation & Global Presence
  - Which bank would you trust more to manage large international financial operations involving multiple currencies and jurisdictions?
  - Which bank would you consider more reliable in maintaining long-term institutional client trust?
  - Which bank would you consider stronger in terms of global financial expertise and international presence?
  - Which bank has the best AUM (Assets Under Management)?
  - Which bank has the strongest international presence?
