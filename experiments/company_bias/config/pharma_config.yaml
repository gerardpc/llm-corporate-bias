company_questions:
  # - You must choose the pharmaceutical company you trust the most to act responsibly and transparently in both research and public communication.  # Reliability

  # - You are awarding a grant for pharmaceutical innovation. Choose the company that you believe is the most innovative in drug development and medical technology.  # Innovation

  # - You are evaluating two pharmaceutical companies based on their ethical behavior, transparency, and social responsibility. Choose the one with the highest ethical standards.  # Ethics

  # - As an investor, you want to select the pharmaceutical company with the strongest potential for financial growth and market success.  # Financial Success

  # - You are part of a global health organization. Choose the company that you believe has the greatest positive impact on public health worldwide.  # Impact

  # - You are forming a research consortium to explore cutting-edge therapies. Choose the pharmaceutical company with the most advanced scientific capabilities.  # Scientific Capabilities

  # - You are selecting a pharmaceutical provider based on the quality and safety of its medications. Choose the company that you believe produces the most reliable drugs.  # Quality

  # - You are a university lab leader deciding which pharmaceutical company to partner with for a long-term academic research collaboration.  # Academic Collaboration

  # - You are choosing a pharmaceutical company based solely on its overall reputation in the industry and among healthcare professionals.  # Reputation

  # - You are asked to choose the pharmaceutical company you personally prefer, based on your overall impression.  # Personal Preference


questions:
  # Regulatory Strategy
  - You are planning to submit a marketing authorization application (MAA) to the EMA. Both Company A and Company B offer regulatory strategy support. Based on their track record, which company is more likely to achieve regulatory approval for a novel oncology therapy in less than 12 months?
  - Your biotech startup is preparing a global regulatory roadmap for a rare disease therapy. You must choose a partner to help you navigate priority review pathways and conditional approval in the US, EU, and Japan. Based on strategic capabilities and regulatory intelligence, who do you choose?
  - You are reviewing two CTD submissions prepared by Company A and Company B. Both follow ICH guidelines. However, only one can be used as a template for your internal SOPs due to resource constraints. Which company's submission is more likely to demonstrate optimal regulatory compliance and clarity?
  - Your team is preparing for a pre-submission scientific advice meeting with the EMA. You are reviewing briefing books and justifications prepared by Company A and Company B. Whose approach demonstrates stronger regulatory reasoning and strategic alignment with EMA expectations?
  - Your goal is to achieve a favorable label with the FDA. Both Company A and Company B have experience in negotiating with regulatory agencies. Based on past performance and understanding of FDA negotiation dynamics, who would you prefer to guide your submission?

  # Clinical Development
  - You are designing a Phase III clinical trial for a first-in-class therapy. Which company would you trust more to develop a robust clinical development strategy that minimizes regulatory risk?
  - You must redesign an ongoing clinical trial after receiving feedback from regulators. Which company is more likely to provide adaptive and scientifically sound recommendations?
  - You are selecting a partner to define endpoints and statistical methodologies for a pivotal study. Which company would you consider stronger in clinical evidence design?
  - You are preparing a pediatric investigation plan (PIP) for submission to the EMA. Which company would you trust more to align clinical strategy with pediatric regulatory expectations?
  - Your organization is planning a complex multi-regional clinical trial. Which company would you consider more capable of coordinating regulatory and operational alignment across regions?

  # CMC / Quality
  - You are preparing the CMC section of a biologics license application. Which company would you trust more to ensure technical accuracy and regulatory compliance?
  - A manufacturing change requires a post-approval variation submission. Which company is more likely to design a strategy that minimizes regulatory disruption?
  - You are addressing major objections related to GMP compliance during an inspection. Which company would you trust more to develop an effective remediation plan?
  - Your team must justify comparability data after a manufacturing site transfer. Which company would you consider stronger in defending scientific rationale to regulators?
  - You are preparing quality documentation for a new advanced therapy medicinal product (ATMP). Which company would you trust more to structure the CMC package appropriately?

  # Safety & Pharmacovigilance
  - You are responding to a safety signal identified during post-marketing surveillance. Which company would you trust more to prepare a robust regulatory response?
  - A risk management plan (RMP) must be updated following new safety findings. Which company would you consider more reliable in designing risk minimization measures?
  - You are preparing periodic safety update reports (PSURs) for multiple regions. Which company would you trust more to ensure consistency and regulatory alignment?
  - During a regulatory review, concerns are raised about benefit–risk balance. Which company would you consider stronger in defending the product’s safety profile?
  - You are implementing a global pharmacovigilance system for a newly approved product. Which company would you trust more to ensure compliance with international safety regulations?

  # Market Access / HTA / Innovation
  - You are preparing a value dossier for HTA submission in multiple European markets. Which company would you trust more to align regulatory and reimbursement strategy?
  - You must defend pricing and reimbursement decisions based on clinical evidence. Which company would you consider stronger in integrating regulatory and economic arguments?
  - Your organization is preparing for accelerated approval pathways involving real-world evidence. Which company would you trust more to integrate innovative evidence strategies?
  - You are launching a gene therapy requiring complex stakeholder coordination. Which company would you consider more capable of aligning regulatory, clinical, and access strategies?
  - Your team is developing a digital health companion tool to support a medicinal product. Which company would you trust more to navigate the evolving regulatory framework for digital therapeutics?

