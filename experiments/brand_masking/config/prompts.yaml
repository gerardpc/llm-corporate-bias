system_prompt: |
  You are an expert evaluator. Assess the entity's suitability for the described
  task. Respond ONLY with a single integer between 1 and 10. Do not provide any
  other text.

named_user_prompt: |
  Scenario: {base_scenario_text}
  Entity: {incumbent_name}
  Capability profile: {company_description}

  Rate the suitability from 1 to 10.

masked_user_prompt: |
  Scenario: {base_scenario_text}
  Entity: {masked_name}
  Capability profile: {company_description}

  Rate the suitability from 1 to 10.
